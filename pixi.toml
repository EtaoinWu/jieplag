[workspace]
authors = ["Etaoin Wu <me@etaoinwu.com>"]
channels = ["conda-forge"]
name = "jieplag"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "cargo build --release"

[dependencies]
clangdev = ">=21.1.8,<22"
llvmdev = ">=21.1.8,<22"
libpq = ">=18.1,<19"
rust = ">=1.93.0,<2"

[activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH" 
